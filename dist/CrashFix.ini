; CrashFix.asi v1.2 ayarlari (scripts\CrashFix.ini)
; Bagimsiz cokme duzeltme (hook/patch) moduludur. Cokme raporlama/minidump islemleri CrashLogger.asi icindedir.
; Log ciktisi: scripts\CrashLogs\CrashFix.log

[Fixes]
; Katman 1 & 2: Episode 2 Part 1 resim galerisi cikis ara sahnesi (ve diger ara sahneler) sonunda
; hedef waypoint indeksi -1 (0xFFFF) olan NPC'lerin gecersiz yuruyuse baslamasini (0047D710) ve
; dunya koordinatlarinin (0, 0, 0)'a sifirlanmasini (004CCD00 / 004D8980) engeller.
Episode2CutsceneWaypointFix=1

; Katman 3: NavTable (0x01437A20) dugum tablosundaki tum indeks erisimlerini (005E1ED0, 005E1AE0, vb.)
; sinir kontrolune alir ve 005E1AE0 / 005E1C00 gecersiz indeks aldiginda NULL yerine yazilabilir
; guvenli dummy yapi dondurerek 0047F1CB ve 005E1F3D cokmelerini onler.
NavTableBoundsFix=1

; Engellenen gecersiz waypoint / dugum erisimlerini scripts\CrashLogs\CrashFix.log dosyasina yaz
LogPreventedCrashes=1
MaxPreventedLogs=100
