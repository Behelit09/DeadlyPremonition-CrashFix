; CrashLogger.asi v1.2 ayarlari (scripts\CrashLogger.ini)
; Saf teshis/loglama moduludur, oyun koduna hicbir yama yapmaz (yamalar CrashFix.asi icindedir).
; Ciktilar: scripts\CrashLogs\  (CrashLogger.log, crash_*.txt, crash_*.dmp)

[CrashLogger]
; 1 = tam bellek dokumu (yuzlerce MB olabilir), 0 = kucuk ama yeterli minidump
FullMemoryDump=0
; Oyunun kendisinin yakalayip devam ettigi hatalari da logla (cokmeden onceki ipuclari)
LogFirstChance=1
MaxFirstChanceLogs=100
; DP.exe'nin actigi son 32 dosyayi hatirla (cokme aninda hangi bolge/asset yukleniyordu)
TrackFileOpens=1
; Her N saniyede bir bellek durumu yaz (0 = kapali). 32-bit adres alani tukenmesini gormek icin.
MemoryLogIntervalSec=60
; Baska bir modun/overlay'in bizim cokme yakalayicimizi ezmesini engelle
LockExceptionFilter=1
